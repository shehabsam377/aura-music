
name: Extract Aura Music ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          if [ ! -f "aura-music-phase1-2-audited.zip" ]; then
            echo "ERROR: ZIP file not found in repository root"
            exit 1
          fi

      - name: Extract project files
        run: |
          mkdir -p extracted
          unzip -o aura-music-phase1-2-audited.zip -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 5 -type f

      - name: Verify project files
        run: |
          if ! find extracted -type f -name "index.html" | grep -q .; then
            echo "ERROR: index.html was not found"
            exit 1
          fi
          echo "Project files verified."

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted
          git diff --cached --quiet || git commit -m "Extract Aura Music project files"
          git push
