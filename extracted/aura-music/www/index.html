<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AURA MUSIC</title>
<style>
:root{color-scheme:dark;--bg:#0e0f13;--panel:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);--tx:#eceef5;--mut:#9aa0b4;--ac:#8b7cf6}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 0;height:100dvh;display:flex;flex-direction:column}
header{padding:16px 16px 8px}h1{font-size:22px;font-weight:650}
#q{width:100%;margin-top:10px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--tx)}
main{flex:1;overflow:auto;padding:0 8px 96px}
.msg{text-align:center;padding:64px 24px;color:var(--mut)}.msg h2{color:var(--tx);margin-bottom:8px}
button{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 18px;cursor:pointer}
button:active{transform:scale(.97)}button.pri{background:var(--ac);border-color:transparent}
.row{display:flex;width:100%;text-align:start;gap:2px;flex-direction:column;border:0;border-radius:10px;background:none;padding:10px 12px;content-visibility:auto;contain-intrinsic-size:auto 56px}
.row.on{background:var(--panel)}.row small{color:var(--mut)}
#mini{position:fixed;inset:auto 8px calc(8px + env(safe-area-inset-bottom)) 8px;background:rgba(28,29,36,.85);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:10px 12px;display:none}
#mini .t{display:flex;align-items:center;gap:10px}#mini .i{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#seek{width:100%;margin-top:8px;accent-color:var(--ac)}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>AURA MUSIC</h1><input id="q" type="search" placeholder="Search title, artist, album" hidden></header>
<main id="main"></main>
<div id="mini"><div class="t"><div class="i"><b id="mt"></b><br><small id="ma"></small></div>
<button id="pp" aria-label="Play or pause">Play</button><button id="nx" aria-label="Next">Next</button></div>
<input id="seek" type="range" min="0" max="0" value="0" aria-label="Seek"></div>
<script>
const AM = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AuraMedia;
const $ = id => document.getElementById(id);
let tracks = [], byId = new Map(), view = [], curId = null, dragging = false, state = 'init', notifAsked = false;

function msg(h, p, btns) {
  const m = $('main'); m.replaceChildren();
  const d = document.createElement('div'); d.className = 'msg';
  const h2 = document.createElement('h2'); h2.textContent = h; d.append(h2);
  const pp = document.createElement('p'); pp.textContent = p; pp.style.marginBottom = '20px'; d.append(pp);
  (btns || []).forEach(([label, fn]) => { const b = document.createElement('button'); b.className = 'pri'; b.textContent = label; b.onclick = fn; d.append(b); });
  m.append(d); $('q').hidden = true;
}
function setState(s, extra) {
  state = s;
  if (s === 'scanning') msg('Scanning your music…', 'Looking for audio on this phone.');
  else if (s === 'permission') msg('Allow access to your music', 'AURA MUSIC reads audio files on this device so you can play them. Nothing is uploaded.', [['Allow access', askPermission]]);
  else if (s === 'denied') msg('Music access is off', 'Turn on the Music and audio permission for AURA MUSIC in Settings, then come back.', [['Open settings', () => AM.openSettings()], ['Try again', askPermission]]);
  else if (s === 'empty') msg('No music found', 'The scan finished but this phone has no audio files that Android lists as music.', [['Scan again', scan]]);
  else if (s === 'error') msg('Something went wrong', extra || 'Unknown error', [['Retry', init]]);
}
async function askPermission() {
  try { const r = await AM.requestAudioPermission(); r.granted ? scan() : setState('denied'); }
  catch (e) { setState('error', e.message); }
}
async function scan() {
  setState('scanning');
  try {
    const r = await AM.scanLibrary();
    byId = new Map(); r.tracks.forEach(t => byId.set(t.id, t)); // de-dupe by stable id
    tracks = [...byId.values()];
    tracks.length ? (renderList(), $('q').hidden = false, state = 'ready') : setState('empty');
    if (!notifAsked) { notifAsked = true; AM.requestNotificationPermission().catch(() => {}); }
  } catch (e) { e.code === 'PERMISSION_DENIED' ? setState('denied') : setState('error', e.message || 'Scan failed'); }
}
function fmt(ms) { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function renderList() {
  const q = $('q').value.trim().toLowerCase();
  view = q ? tracks.filter(t => (t.title + ' ' + t.artist + ' ' + t.album).toLowerCase().includes(q)) : tracks;
  const m = $('main'), f = document.createDocumentFragment(); m.replaceChildren();
  if (!view.length) { msg('No matches', 'Try a different search.'); $('q').hidden = false; return; }
  view.forEach((t, i) => {
    const b = document.createElement('button'); b.className = 'row' + (t.id === curId ? ' on' : ''); b.dataset.id = t.id;
    const a = document.createElement('span'); a.textContent = t.title;
    const s = document.createElement('small'); s.textContent = [t.artist, t.album, fmt(t.duration)].filter(Boolean).join(' · ');
    b.append(a, s); b.onclick = () => play(i); f.append(b);
  });
  m.append(f);
}
function play(i) {
  AM.playQueue({ items: view.map(({ id, uri, title, artist, album }) => ({ id, uri, title, artist, album })), index: i });
}
function onState(s) {
  const changed = s.mediaId !== curId; curId = s.mediaId || null;
  const t = byId.get(curId);
  $('mini').style.display = t ? 'block' : 'none';
  if (!t) return;
  $('mt').textContent = t.title; $('ma').textContent = t.artist;
  $('pp').textContent = s.isPlaying ? 'Pause' : 'Play';
  if (!dragging) { $('seek').max = s.duration || t.duration; $('seek').value = s.position; }
  if (changed && state === 'ready') document.querySelectorAll('.row').forEach(r => r.classList.toggle('on', r.dataset.id === curId));
}
async function init() {
  if (!AM) return setState('error', 'The native Android audio bridge is not available. Run this inside the built app, not a browser.');
  AM.addListener('playerState', onState);
  AM.addListener('playerError', e => { alert('Cannot play this file: ' + e.message); AM.next(); });
  $('pp').onclick = () => AM.toggle(); $('nx').onclick = () => AM.next();
  $('seek').oninput = () => dragging = true;
  $('seek').onchange = e => { AM.seek({ position: Math.round(+e.target.value) }); dragging = false; };
  $('q').oninput = renderList;
  document.addEventListener('visibilitychange', async () => { // recovery after Settings or revoked permission
    if (document.hidden || !AM) return;
    const p = await AM.checkPermission();
    if (state === 'denied' && p.granted) scan(); else if (state === 'ready' && !p.granted) setState('denied');
  });
  try { const p = await AM.checkPermission(); p.granted ? scan() : setState('permission'); }
  catch (e) { setState('error', e.message); }
}
init();
</script>
</body>
</html>
